name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref (fast feedback on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check serverless functions
        run: |
          for f in api/*.js; do node --check "$f"; done

      - name: Build (client + SSR + prerender)
        run: npm run build

      - name: Lint ceiling
        run: node scripts/lint-check.mjs

      - name: Smoke tests
        run: node scripts/smoke-test.mjs
