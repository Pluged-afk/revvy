<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 260px; margin: 0; font-family: 'DM Sans', -apple-system, Segoe UI, Roboto, sans-serif; background: #0f1424; color: #e7e9f3; }
    .wrap { padding: 16px 16px 18px; }
    .brand { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 18px; letter-spacing: .3px; display: flex; align-items: center; gap: 7px; }
    .dot { width: 22px; height: 22px; border-radius: 7px; background: #4f46e5; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: #fff; font-weight: 800; }
    .sub { font-size: 12.5px; color: #9aa0b8; margin: 8px 0 14px; line-height: 1.45; }
    button { width: 100%; border: none; border-radius: 10px; background: #4f46e5; color: #fff; font-size: 13.5px; font-weight: 700; padding: 11px 12px; cursor: pointer; font-family: inherit; }
    button:hover { background: #4338ca; }
    button:disabled { opacity: .6; cursor: default; }
    #msg { font-size: 11.5px; color: #9aa0b8; margin-top: 10px; min-height: 14px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot">R</span>Revyy</div>
    <p class="sub">Turn the article you're reading into a practice quiz.</p>
    <button id="go">Make a quiz from this page</button>
    <div id="msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
