<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revyy</title>
<style>
  :root { --indigo:#4f46e5; --indigo-dark:#312e81; --ink:#1e293b; --sub:#64748b; --border:#e2e8f0; --bg:#f8fafc; }
  * { box-sizing:border-box; }
  body { margin:0; width:320px; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:var(--ink); background:#fff; }
  .head { display:flex; align-items:center; gap:9px; padding:14px 16px; background:linear-gradient(135deg,var(--indigo-dark),var(--indigo)); color:#fff; }
  .head svg { flex-shrink:0; }
  .head b { font-size:16px; font-weight:700; letter-spacing:.2px; }
  .body { padding:14px 16px 16px; }
  .src { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--indigo); margin-bottom:6px; }
  #preview { font-size:12.5px; line-height:1.5; color:var(--sub); background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; min-height:52px; max-height:96px; overflow:hidden; }
  .row { display:flex; gap:10px; margin-top:12px; }
  .field { flex:1; }
  .field label { display:block; font-size:11px; font-weight:600; color:var(--sub); margin-bottom:4px; }
  select { width:100%; border:1.5px solid var(--border); border-radius:9px; padding:9px 10px; font-size:13px; font-family:inherit; background:#fff; color:var(--ink); outline:none; }
  select:focus { border-color:var(--indigo); }
  #go { width:100%; margin-top:14px; border:none; border-radius:11px; padding:12px; font-size:14px; font-weight:700; color:#fff; background:var(--indigo); cursor:pointer; font-family:inherit; }
  #go:disabled { opacity:.45; cursor:not-allowed; }
  #status { font-size:11.5px; color:var(--sub); text-align:center; margin-top:9px; min-height:15px; }
  .foot { font-size:10.5px; color:#94a3b8; text-align:center; padding:0 16px 12px; line-height:1.5; }
</style>
</head>
<body>
  <div class="head">
    <svg width="24" height="24" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="28" height="28" rx="8" fill="#fff"/>
      <path d="M8 15 L12.5 20 L20.5 9" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <b>Revyy</b>
  </div>
  <div class="body">
    <div class="src" id="srcLabel">Preview</div>
    <div id="preview">Reading this page…</div>
    <div class="row">
      <div class="field">
        <label for="type">Format</label>
        <select id="type">
          <option value="mcq">Multiple choice</option>
          <option value="cards">Flashcards</option>
          <option value="fill">Fill in the blank</option>
        </select>
      </div>
      <div class="field">
        <label for="count">Questions</label>
        <select id="count">
          <option value="5">5</option>
          <option value="10" selected>10</option>
          <option value="15">15</option>
          <option value="20">20</option>
        </select>
      </div>
    </div>
    <button id="go" disabled>Make quiz →</button>
    <div id="status"></div>
  </div>
  <div class="foot">Opens Revyy with this page ready to go. Sign in there to generate, free.</div>
  <script src="popup.js"></script>
</body>
</html>
