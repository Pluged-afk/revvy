<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apply the saved theme before first paint so there is no light/dark flash. -->
    <script>
      (function(){try{var s=JSON.parse(localStorage.getItem("revyy_settings")||"{}")||{};var t=s.theme==="dark"?"dark":s.theme==="light"?"light":(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",t==="dark"?"#181818":"#fbf9f4");}catch(e){}})();
    </script>

    <!-- Primary SEO -->
    <title>Revyy: Practice Quizzes & Mock Exams From Your Own Notes</title>
    <meta name="description" content="Revyy is a free study tool for students. Upload a PDF or paste your notes and get practice quizzes and graded mock exams built from your own material. Spaced review brings back what you get wrong, right up to exam day." />
    <meta name="keywords" content="exam prep, mock exam generator, quiz generator, practice test maker, study quiz, turn notes into quiz, exam practice questions, flashcard maker, spaced repetition, revision tool, quiz from PDF" />
    <meta name="author" content="Revyy" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://revyy.app/" />
    <meta name="theme-color" content="#fbf9f4" />

    <!-- Installable PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Revyy" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Revyy" />
    <meta property="og:title" content="Revyy: Practice Quizzes & Mock Exams From Your Own Notes" />
    <meta property="og:description" content="Upload a PDF or paste your notes, and get practice quizzes and graded mock exams built from your own material. Free for students." />
    <meta property="og:url" content="https://revyy.app/" />
    <meta property="og:image" content="https://revyy.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="Revyy: turn your notes into exam practice that sticks" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Revyy: Quizzes & Mock Exams From Your Notes" />
    <meta name="twitter:description" content="Turn your own notes into practice quizzes and graded mock exams, then review your weak spots with spaced repetition until exam day." />
    <meta name="twitter:image" content="https://revyy.app/og-image.png" />

    <!-- Google AdSense. Consent for the EEA, UK and Switzerland, plus US state
         privacy opt-outs, is handled by Google's certified consent management
         (configured in the AdSense account). It shows a consent message to
         visitors in covered regions before advertising cookies are used, so we
         do not run a second, non-certified banner of our own. -->
    <meta name="google-adsense-account" content="ca-pub-7771463873865547" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7771463873865547" crossorigin="anonymous"></script>

    <!-- Structured data: helps Google understand the site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://revyy.app/#organization",
          "name": "Revyy",
          "url": "https://revyy.app/",
          "logo": "https://revyy.app/favicon.svg",
          "description": "AI-powered exam-prep and quiz generator for students."
        },
        {
          "@type": "WebSite",
          "@id": "https://revyy.app/#website",
          "url": "https://revyy.app/",
          "name": "Revyy",
          "description": "Turn any material into exam practice: quizzes and graded mock exams built from your own notes.",
          "publisher": { "@id": "https://revyy.app/#organization" },
          "inLanguage": "en"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Revyy",
          "operatingSystem": "Web",
          "applicationCategory": "EducationalApplication",
          "url": "https://revyy.app/",
          "description": "Revyy turns PDFs, notes and photos into AI-generated quizzes and AI-graded mock exams, then drills missed questions with spaced review until exam day.",
          "offers": [
            { "@type": "Offer", "price": "0", "priceCurrency": "EUR", "name": "Free" },
            { "@type": "Offer", "price": "4.99", "priceCurrency": "EUR", "name": "Pro" }
          ]
        }
      ]
    }
    </script>

    <!-- Fonts are self-hosted (public/fonts) so no visitor IP is sent to
         Google's font CDN. See public/fonts/fonts.css. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <!-- The build-time prerenderer (scripts/prerender.mjs) injects real,
         crawlable per-route HTML in place of this marker. React then mounts
         into #root on load. -->
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
